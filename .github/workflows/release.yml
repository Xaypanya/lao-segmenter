name: Release

# Push a version tag to cut a release:
#   npm version minor && git push --follow-tags
#
# Requires one repository secret: NPM_TOKEN — an npmjs.com automation token
# with publish rights on `lao-segmenter`.
# Settings → Secrets and variables → Actions → New repository secret.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm run test:pkg

      # Fail early if the tag and package.json disagree.
      - name: Check tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version $PKG"
            exit 1
          fi

      - name: Publish to npmjs.com
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Also publish to GitHub Packages so the repo's Packages panel links here.
      # GitHub Packages requires a scoped name, so it is renamed just for this
      # publish and reverted straight after.
      - name: Publish to GitHub Packages
        run: |
          npm pkg set name=@xaypanya/lao-segmenter
          npm publish --registry=https://npm.pkg.github.com --access public || true
          git checkout -- package.json
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create the GitHub release
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --latest \
            --notes "See [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md) for the full list of changes.

          \`\`\`bash
          npm install lao-segmenter@${GITHUB_REF_NAME#v}
          \`\`\`"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
