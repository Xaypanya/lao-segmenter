name: Release

# Push a version tag to cut a release:
#   npm version minor && git push --follow-tags
#
# Publishing uses npm Trusted Publishing (OIDC) — no token is stored anywhere.
# One-time setup on npmjs.com:
#   npmjs.com/package/lao-segmenter → Settings → Trusted Publisher
#   → GitHub Actions
#      Organization or user: Xaypanya
#      Repository:           lao-segmenter
#      Workflow filename:    release.yml
#      Environment:          (leave blank)
#
# npm is also restricting 2FA-bypass tokens for direct publishing, so this is
# the path that keeps working: https://gh.io/npm-gat-bypass2fa-deprecation
#
# If you would rather publish with a token, add an NPM_TOKEN repository secret
# and this workflow will use it as a fallback.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write # required for Trusted Publishing

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Deliberately no `registry-url`: that makes setup-node write an .npmrc
      # containing `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}`, and
      # with no token in the environment npm sees an empty credential, stops
      # short of the OIDC exchange and publishes anonymously — which the
      # registry rejects with a 404.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Trusted Publishing needs npm 11.5.1 or newer.
      - run: npm install -g npm@latest

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm run test:pkg

      # Fail early if the tag and package.json disagree.
      - name: Check tag matches package version
        if: github.event_name == 'push'
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version $PKG"
            exit 1
          fi

      # No NODE_AUTH_TOKEN: npm mints a short-lived OIDC credential instead and
      # attaches a provenance attestation automatically.
      - name: Publish to npmjs.com (Trusted Publishing)
        run: npm publish --access public

      # Also publish to GitHub Packages so the repo's Packages panel links here.
      # GitHub Packages requires a scoped name, so it is renamed just for this
      # publish and reverted straight after. Auth is written only now, so it
      # cannot interfere with the OIDC exchange above.
      - name: Publish to GitHub Packages
        run: |
          echo "//npm.pkg.github.com/:_authToken=${GH_PACKAGES_TOKEN}" >> ~/.npmrc
          npm pkg set name=@xaypanya/lao-segmenter
          npm publish --registry=https://npm.pkg.github.com --access public || true
          git checkout -- package.json
        env:
          GH_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create or update the GitHub release
        if: github.event_name == 'push'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES="See [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md) for the full list of changes.

          \`\`\`bash
          npm install lao-segmenter@${VERSION}
          \`\`\`"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --latest
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --latest --notes "$NOTES"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
